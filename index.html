<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WaitMote 等待微光</title>
  <style>
    :root{color-scheme:dark;--ink:#f4fbff;--muted:#9fb7c9;--cyan:#7df5ff;--gold:#ffd176;--rose:#ff88cf;--green:#8ff0ad;--panel:rgba(5,13,31,.72)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#030611;color:var(--ink);font-family:Inter,ui-rounded,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
    #app{width:min(100vw,480px);height:min(100vh,860px);position:relative;overflow:hidden;border-radius:30px;background:#050917;box-shadow:0 30px 110px #000,0 0 0 1px rgba(151,233,255,.12)}canvas{width:100%;height:100%;display:block;touch-action:none}
    .hud{position:absolute;left:14px;right:14px;top:12px;pointer-events:none}.glass{background:linear-gradient(180deg,rgba(14,28,57,.82),rgba(5,12,29,.66));border:1px solid rgba(165,236,255,.22);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(14px)}.top{padding:11px 12px 10px}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:950;letter-spacing:.03em;text-shadow:0 0 16px rgba(125,245,255,.75)}.pill{font-size:12px;font-weight:900;color:#06131d;background:linear-gradient(90deg,var(--cyan),#d3a7ff,var(--gold));border-radius:999px;padding:4px 9px;box-shadow:0 0 18px rgba(125,245,255,.34)}.task{margin-top:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#c2d7e7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task:before{content:'▸ ';color:var(--green)}.bar{height:13px;margin-top:9px;border-radius:99px;overflow:hidden;background:rgba(2,8,21,.76);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 0 14px rgba(0,0,0,.55)}.fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#64eaff,#ba8cff,#ffdb7d);box-shadow:0 0 18px #7df5ff;transition:width .45s cubic-bezier(.2,.9,.1,1)}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:12px;color:var(--muted)}
    #codex{position:absolute;right:14px;top:112px;width:min(230px,calc(100% - 28px));max-height:50%;overflow:auto;padding:12px;z-index:4;font-size:13px}.codexTitle{font-weight:950;margin-bottom:8px}.beast{display:flex;align-items:center;justify-content:space-between;margin:7px 0;padding:8px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.04)}.caught{color:var(--green)}.hidden{display:none!important}
    #log{position:absolute;left:14px;right:14px;bottom:130px;z-index:3;display:flex;align-items:flex-end;min-height:84px;pointer-events:none}.msg{width:100%;padding:13px 14px;font-size:15px;line-height:1.45;color:#eaf8ff}.msg b{color:var(--gold)}.controls{position:absolute;left:14px;right:14px;bottom:14px;z-index:5;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.btn{min-height:52px;border:1px solid rgba(181,242,255,.26);border-radius:18px;background:linear-gradient(180deg,rgba(43,66,118,.96),rgba(13,26,61,.96));color:var(--ink);font-weight:950;font-size:15px;letter-spacing:.02em;box-shadow:0 9px 0 rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.16),0 0 24px rgba(75,213,255,.08)}.btn:active{transform:translateY(4px);box-shadow:0 5px 0 rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.16)}.btn[disabled]{opacity:.46;filter:saturate(.35)}.wide{grid-column:1/3}.gold{background:linear-gradient(180deg,rgba(122,83,35,.98),rgba(69,45,25,.96));border-color:rgba(255,213,118,.34)}
    .titleScreen{position:absolute;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:28px;background:radial-gradient(circle at 50% 32%,rgba(122,244,255,.14),transparent 27%),linear-gradient(180deg,rgba(2,6,17,.32),rgba(2,6,17,.78))}.mark{text-align:center}.mark h1{margin:0;font-size:44px;line-height:.96;letter-spacing:.02em;text-shadow:0 0 30px rgba(125,245,255,.6),0 10px 35px #000}.mark p{margin:10px 0 0;color:#b8cfdf}.terminal{padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#c9ddeb}.line{display:flex;gap:8px;margin:7px 0}.ok{color:var(--green)}.warn{color:var(--gold)}
    .toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:7;min-width:280px;padding:18px;text-align:center;border-radius:24px;background:rgba(2,8,20,.78);border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 999px rgba(0,0,0,.32),0 26px 90px #000;backdrop-filter:blur(10px);animation:pop .9s ease both;pointer-events:none}.toast .small{color:var(--muted);font-size:12px;letter-spacing:.18em}.toast .name{font-size:28px;font-weight:950;color:var(--gold);text-shadow:0 0 24px rgba(255,209,118,.5)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-44%) scale(.86)}18%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-54%) scale(.98)}}
  </style>
</head>
<body>
<div id="app" aria-label="WaitMote 等待微光">
  <canvas id="game" width="480" height="860"></canvas>
  <section class="titleScreen" id="titleScreen">
    <div class="mark"><h1>WaitMote<br><span style="color:var(--cyan)">等待微光</span></h1><p>把漫长等待，走成一条会发光的夜路。</p></div>
    <div class="terminal glass"><div class="line"><span class="ok">●</span><span>agent.waitmote.local 已连接</span></div><div class="line"><span class="warn">◆</span><span>正在侦听林间微弱回应…</span></div><div class="line"><span>◇</span><span>提示：轻点前进，遇见原创微光生灵。</span></div></div>
  </section>
  <div class="hud"><div class="glass top"><div class="brand"><span class="logo">WaitMote 等待微光</span><span id="state" class="pill">待机</span></div><div class="task" id="task">Agent 正在整理月光缓存…</div><div class="bar"><div id="fill" class="fill"></div></div><div class="meta"><span id="stats">微光 HP 30/30</span><span id="count">图鉴 0/6</span></div></div></div>
  <aside id="codex" class="glass hidden"></aside>
  <div id="log"><div class="glass msg" id="msg">点“开始等待”，让等待变成一段夜路。</div></div>
  <div class="controls" id="controls"></div>
</div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={fill:qs('fill'),msg:qs('msg'),controls:qs('controls'),state:qs('state'),task:qs('task'),stats:qs('stats'),count:qs('count'),codex:qs('codex'),title:qs('titleScreen')};
function qs(id){return document.getElementById(id)} const TAU=Math.PI*2, saveKey='waitmote-save-v1';
const foes=[
 {id:'dew',name:'露铃',hp:18,color:'#8ff8ff',accent:'#d7ffff',skill:'凝露',shape:'bell',bio:'挂在叶尖的清亮铃影'},
 {id:'ember',name:'烬萤',hp:20,color:'#ffb35c',accent:'#ffe091',skill:'火星',shape:'ember',bio:'把余烬抱成心跳的小萤'},
 {id:'moss',name:'苔团',hp:24,color:'#8df0a4',accent:'#d6ffd2',skill:'软撞',shape:'moss',bio:'披着露水苔衣的慢吞吞团子'},
 {id:'echo',name:'回声芽',hp:19,color:'#b99aff',accent:'#f0dcff',skill:'回响',shape:'echo',bio:'会把脚步声开成花'},
 {id:'paper',name:'纸月雀',hp:17,color:'#fff0a5',accent:'#ffffff',skill:'月羽',shape:'bird',bio:'折纸一样轻的月下小雀'},
 {id:'ink',name:'墨影豆',hp:26,color:'#7897ff',accent:'#c8d4ff',skill:'影滴',shape:'ink',bio:'藏在影子背面的蓝色豆影'}];
let raw={};try{raw=JSON.parse(localStorage.getItem(saveKey)||'{}')||{}}catch{raw={}};let save={version:2,caught:raw.caught||{},walks:raw.walks||0,muted:!!raw.muted};store();
let mode='intro',progress=0,world=0,t=0,busy=false,shake=0,flash=0,toastT=0,mote={x:118,y:618,hp:30,max:30,glow:0},foe=null,particles=[],floaters=[],stars=[];
const tasks=['Agent 正在整理月光缓存…','Agent 正在采样林间微风…','Agent 正在压缩星尘向量…','Agent 正在排队等待远方回应…','Agent 侦测到：雾里有东西轻轻动了一下…'];
function rnd(a,b){return Math.random()*(b-a)+a} function clamp(v,a,b){return Math.max(a,Math.min(b,v))} function store(){localStorage.setItem(saveKey,JSON.stringify(save))}
function say(s){ui.msg.innerHTML=s} function setButtons(list){ui.controls.innerHTML='';list.forEach(b=>{let el=document.createElement('button');el.className='btn '+(b.wide?'wide ':'')+(b.gold?'gold':'');el.textContent=b.t;el.disabled=!!b.disabled;el.onclick=()=>!busy&&b.f();ui.controls.appendChild(el)})}
function start(){ui.title.classList.add('hidden');mode='walk';progress=0;world=0;mote.hp=mote.max;save.walks++;store();say('终端亮起：<b>开始等待</b>。轻点屏幕或按钮，让微光向森林深处前进。');walkButtons();ping(240,610,'#7df5ff',28)}
function walkButtons(){setButtons([{t:'轻点前进',f:advance,gold:true},{t:'等待图鉴',f:toggleCodex},{t:save.muted?'开启声音':'静音/声音',f:toggleSound},{t:'休息 +6HP',f:()=>{mote.hp=clamp(mote.hp+6,0,mote.max);say('微光在蘑菇灯旁休息，亮度恢复了一点。');ping(mote.x,mote.y,'#8ff0ad',18)}}])}
function advance(){if(mode!=='walk')return;progress=clamp(progress+rnd(7,13),0,100);world+=rnd(42,70);mote.glow=1;trail(14);if(progress>=100){mode='done';say('等待完成！Agent 带回一袋温暖星尘。你可以再走一轮，继续收集图鉴。');setButtons([{t:'再等一轮',f:start,gold:true},{t:'等待图鉴',f:toggleCodex}]);return} if(Math.random()<.42)encounter();else say(['树冠层层后退，进度条像晨线一样推开夜色。','蓝白色光点绕着你排队，像在显示 Agent 状态。','等待没有消失，它变成了脚下发亮的路。'][Math.floor(rnd(0,3))])}
function encounter(){foe={...foes[Math.floor(rnd(0,foes.length))]};foe.max=foe.hp;foe.in=0;mode='battle';flash=1;shake=12;toast(`有东西出现了`,foe.name);say(`<b>${foe.name}</b> 从雾里靠近。${foe.bio}。`);setTimeout(()=>battleButtons(),420)}
function battleButtons(){setButtons([{t:'微闪 5伤',f:()=>skill('flash')},{t:'安抚 3伤+回血',f:()=>skill('calm')},{t:'星尘 8伤',f:()=>skill('star')},{t:'收服',f:catchFoe,gold:true}])}
function skill(type){if(!foe)return;busy=true;let d={flash:5,calm:3,star:8}[type]+Math.floor(rnd(0,3));let text={flash:'微闪划出一弧青白亮线',calm:'安抚的圆环慢慢扩散',star:'星尘像小小流星雨落下'}[type];if(type==='calm')mote.hp=clamp(mote.hp+4,0,mote.max);foe.hp=clamp(foe.hp-d,0,foe.max);fx(type);if(foe.hp<=0)return win(`${text}。<b>${foe.name}</b> 化作愿意同行的光点。`);setTimeout(()=>{let hurt=Math.floor(rnd(3,7));mote.hp=clamp(mote.hp-hurt,0,mote.max);shake=5;say(`${text}，造成 ${d} 点。${foe.name} 使用${foe.skill}，微光 -${hurt}HP。`);busy=false;if(mote.hp<=0){mode='walk';mote.hp=12;foe=null;say('微光暗了一瞬，又在路边醒来。进度保留，慢慢继续。');walkButtons()}},520)}
function catchFoe(){if(!foe)return;busy=true;let chance=.32+(1-foe.hp/foe.max)*.58;spiral(330,424,foe.color);setTimeout(()=>{if(Math.random()<chance){save.caught[foe.id]=(save.caught[foe.id]||0)+1;store();win(`<b>${foe.name}</b> 被收进温暖光瓶，图鉴更新！`)}else{say(`${foe.name} 在光瓶里闪了两下，又笑着跳回雾中。`);busy=false;skill('flash')}},760)}
function win(s){busy=false;mode='walk';progress=clamp(progress+8,0,100);ping(330,424,foe?foe.color:'#fff',34);foe=null;say(s);walkButtons()}
function toggleCodex(){ui.codex.classList.toggle('hidden');ui.codex.innerHTML='<div class="codexTitle">等待图鉴 · 原创微光生灵</div>'+foes.map(f=>`<div class="beast"><span>${save.caught[f.id]?'<b class="caught">●</b>':'○'} ${f.name}<br><small>${f.bio}</small></span><b>×${save.caught[f.id]||0}</b></div>`).join('')+'<button class="btn wide" id="reset">重置存档</button>';qs('reset').onclick=()=>{localStorage.removeItem(saveKey);location.reload()}}
function toggleSound(){save.muted=!save.muted;store();say(save.muted?'环境声已关闭。':'环境声已开启（轻柔提示音）。');walkButtons();beep(440,.04)}
let audio=null;function beep(freq,dur){if(save.muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function ping(x,y,c,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-2.4,2.4),vy:rnd(-2.8,1.2),r:rnd(1.5,4.5),life:rnd(28,58),max:58,c})}function trail(n){for(let i=0;i<n;i++)particles.push({x:mote.x+rnd(-16,16),y:mote.y+rnd(-8,16),vx:rnd(-1.8,.5),vy:rnd(-.8,.8),r:rnd(1,3),life:rnd(22,42),max:42,c:'#7df5ff'})}function fx(type){if(type==='flash'){shake=7;for(let i=0;i<28;i++)particles.push({x:rnd(250,360),y:rnd(360,455),vx:rnd(1,4),vy:rnd(-2,2),r:rnd(2,5),life:35,max:35,c:'#8ff8ff'})}if(type==='calm'){for(let i=0;i<34;i++){let a=i/34*TAU;particles.push({x:330+Math.cos(a)*20,y:424+Math.sin(a)*12,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.1,r:3,life:48,max:48,c:'#8ff0ad'})}}if(type==='star'){shake=10;flash=.45;for(let i=0;i<42;i++)particles.push({x:rnd(250,380),y:rnd(300,390),vx:rnd(-.8,.8),vy:rnd(1.8,4.2),r:rnd(2,5),life:46,max:46,c:i%2?'#ffd176':'#d3a7ff'})}beep(type==='star'?660:520,.06)}function spiral(x,y,c){for(let i=0;i<70;i++){let a=i*.42;particles.push({x:x+Math.cos(a)*i*.45,y:y+Math.sin(a)*i*.28,vx:Math.cos(a)*-.7,vy:Math.sin(a)*-.5,r:rnd(2,4),life:64,max:64,c})}beep(740,.12)}function toast(a,b){let d=document.createElement('div');d.className='toast';d.innerHTML=`<div class="small">${a}</div><div class="name">${b}</div>`;document.getElementById('app').appendChild(d);setTimeout(()=>d.remove(),920)}
function draw(){t+=.016;let ox=shake?rnd(-shake,shake):0,oy=shake?rnd(-shake,shake):0;shake*=.86;ctx.save();ctx.translate(ox,oy);scene();if(mode!=='intro')drawMote(mote.x,mode==='battle'?620:618);if(foe)drawFoe(foe,330,424);drawParticles();if(flash>0){ctx.fillStyle=`rgba(210,245,255,${flash*.28})`;ctx.fillRect(0,0,480,860);flash*=.86}ctx.restore();updateUi();requestAnimationFrame(draw)}
function scene(){let g=ctx.createLinearGradient(0,0,0,860);g.addColorStop(0,'#061338');g.addColorStop(.48,'#11102d');g.addColorStop(1,'#04131a');ctx.fillStyle=g;ctx.fillRect(0,0,480,860);if(!stars.length)for(let i=0;i<120;i++)stars.push({x:rnd(0,480),y:rnd(18,430),r:rnd(.4,1.6),p:rnd(0,TAU)});ctx.save();ctx.globalCompositeOperation='lighter';let mg=ctx.createRadialGradient(370,115,8,370,115,130);mg.addColorStop(0,'rgba(235,250,255,.9)');mg.addColorStop(.12,'rgba(235,250,255,.5)');mg.addColorStop(1,'rgba(125,245,255,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(370,115,130,0,TAU);ctx.fill();ctx.restore();stars.forEach(s=>{ctx.globalAlpha=.35+Math.sin(t*2+s.p)*.25;ctx.fillStyle='#e4fbff';ctx.beginPath();ctx.arc((s.x-world*.03+480)%480,s.y,s.r,0,TAU);ctx.fill()});ctx.globalAlpha=1;layer('#13254a',520,.08,70);layer('#0b2034',600,.18,95);trees('#102236',.32,250,600);path();trees('#07131d',.62,90,690);fog();motes()}
function layer(col,base,spd,amp){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,860);for(let x=0;x<=520;x+=40){let y=base+Math.sin((x+world*spd)*.018)*amp;ctx.lineTo(x,y)}ctx.lineTo(520,860);ctx.fill()}function trees(col,spd,gap,base){ctx.fillStyle=col;ctx.strokeStyle='rgba(130,237,255,.12)';for(let i=-1;i<8;i++){let x=((i*gap-world*spd)%650+650)%650-70,h=180+((i*37)%90);ctx.fillRect(x+24,base-h*.35,12,h);ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+30,base-h);ctx.lineTo(x+70,base);ctx.fill();ctx.stroke()}}function path(){ctx.fillStyle='#0a151d';ctx.beginPath();ctx.moveTo(58,860);ctx.quadraticCurveTo(220,655,430,860);ctx.fill();ctx.strokeStyle='rgba(255,209,118,.18)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(92,760);ctx.quadraticCurveTo(240,650,400,748);ctx.stroke()}function fog(){for(let i=0;i<5;i++){ctx.fillStyle=`rgba(145,210,230,${.035+i*.008})`;ctx.beginPath();ctx.ellipse(240+Math.sin(t+i)*80,520+i*44,260,32,0,0,TAU);ctx.fill()}}function motes(){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<42;i++){let x=(i*73+Math.sin(t+i)*18-world*.16)%520-20,y=260+(i*47%420)+Math.sin(t*1.5+i)*12;ctx.fillStyle=i%3?'rgba(125,245,255,.55)':'rgba(255,209,118,.48)';ctx.beginPath();ctx.arc(x,y,1.5+(i%4)*.45,0,TAU);ctx.fill()}ctx.restore()}
function drawMote(x,y){let bob=Math.sin(t*4)*5;ctx.save();ctx.globalCompositeOperation='lighter';let aura=ctx.createRadialGradient(x,y+bob,4,x,y+bob,62+28*mote.glow);aura.addColorStop(0,'rgba(210,255,250,.9)');aura.addColorStop(.22,'rgba(125,245,255,.35)');aura.addColorStop(1,'rgba(125,245,255,0)');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(x,y+bob,90,0,TAU);ctx.fill();ctx.fillStyle='rgba(185,251,255,.95)';ctx.beginPath();ctx.ellipse(x,y+bob,18,24,0,0,TAU);ctx.fill();ctx.fillStyle='rgba(160,220,255,.25)';ctx.beginPath();ctx.ellipse(x-22,y+bob+2,26,10,-.45,0,TAU);ctx.ellipse(x+22,y+bob+2,26,10,.45,0,TAU);ctx.fill();ctx.restore();mote.glow*=.9}
function drawFoe(f,x,y){f.in=clamp((f.in||0)+.04,0,1);let yy=y+(1-f.in)*60+Math.sin(t*3)*5;ctx.save();ctx.globalCompositeOperation='lighter';let rg=ctx.createRadialGradient(x,yy,5,x,yy,86);rg.addColorStop(0,f.color+'99');rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,yy,90,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.fillStyle=f.color;ctx.strokeStyle=f.accent;ctx.lineWidth=3;if(f.shape==='bell'){ctx.beginPath();ctx.moveTo(x,yy-40);ctx.quadraticCurveTo(x-42,yy-25,x-34,yy+24);ctx.quadraticCurveTo(x,yy+42,x+34,yy+24);ctx.quadraticCurveTo(x+42,yy-25,x,yy-40);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(x,yy+35,7,0,TAU);ctx.fill()}else if(f.shape==='ember'){ctx.beginPath();ctx.moveTo(x,yy-48);ctx.bezierCurveTo(x-48,yy-8,x-22,yy+44,x,yy+38);ctx.bezierCurveTo(x+44,yy+28,x+38,yy-18,x,yy-48);ctx.fill();ctx.stroke()}else if(f.shape==='moss'){for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(x+Math.cos(i)*28,yy+Math.sin(i*2)*17,22,0,TAU);ctx.fill();ctx.stroke()}}else if(f.shape==='echo'){ctx.beginPath();ctx.ellipse(x,yy+8,28,38,0,0,TAU);ctx.fill();ctx.stroke();for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x,yy,38+i*14,Math.PI*1.12,Math.PI*1.88);ctx.stroke()}}else if(f.shape==='bird'){ctx.beginPath();ctx.moveTo(x-48,yy);ctx.lineTo(x,yy-34);ctx.lineTo(x+48,yy);ctx.lineTo(x+8,yy+30);ctx.lineTo(x-8,yy+30);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.ellipse(x,yy,38,32,0,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(4,8,20,.75)';ctx.beginPath();ctx.arc(x-22,yy-12,14,0,TAU);ctx.arc(x+28,yy+10,12,0,TAU);ctx.fill()}ctx.fillStyle='#06101d';ctx.fillRect(x-11,yy-4,6,7);ctx.fillRect(x+8,yy-4,6,7);hpbar(x-48,yy+64,96,foe.hp/foe.max,f.color);ctx.restore()}
function hpbar(x,y,w,p,c){ctx.fillStyle='rgba(0,0,0,.45)';round(x,y,w,10,6);ctx.fill();ctx.fillStyle=c;round(x,y,w*clamp(p,0,1),10,6);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.25)';round(x,y,w,10,6);ctx.stroke()}function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawParticles(){ctx.save();ctx.globalCompositeOperation='lighter';particles=particles.filter(p=>p.life-->0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.025;ctx.globalAlpha=clamp(p.life/(p.max||50),0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill()});ctx.restore();ctx.globalAlpha=1;if(particles.length>190)particles.splice(0,particles.length-190)}
function updateUi(){ui.fill.style.width=progress+'%';ui.state.textContent=mode==='intro'?'待机':mode==='battle'?'遭遇':mode==='done'?'完成':'散步';ui.task.textContent=tasks[Math.floor(Date.now()/1900)%tasks.length];ui.stats.textContent=`微光 HP ${mote.hp}/${mote.max}${foe?' · '+foe.name+' '+foe.hp+'/'+foe.max:''}`;ui.count.textContent=`图鉴 ${Object.keys(save.caught).length}/${foes.length}`}
canvas.addEventListener('pointerdown',e=>{if(mode==='walk'){let r=canvas.getBoundingClientRect();ping((e.clientX-r.left)*480/r.width,(e.clientY-r.top)*860/r.height,'#7df5ff',10);advance()}});
setButtons([{t:'开始等待',f:start,wide:true,gold:true},{t:'等待图鉴',f:toggleCodex,wide:true}]);draw();
})();
</script>
